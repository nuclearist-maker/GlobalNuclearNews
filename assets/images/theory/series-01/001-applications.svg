<rect width="1600" height="900" rx="36" fill="url(#bg)"/><text x="90" y="92" fill="#80defa" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="28" font-weight="700">원자력이론 · 핵심 개념</text><text x="90" y="154" fill="white" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="52" font-weight="800">하나의 원리, 여러 응용</text><text x="90" y="202" fill="#cceafa" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="25">핵반응과 방사선의 생성·전달·측정·차폐가 공통 기반</text><g filter="url(#sh)"><rect x="95" y="290" width="650" height="190" rx="28" fill="#0d2942" stroke="#5bd9ff" stroke-width="3"/><text x="125" y="348" fill="#5bd9ff" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="29" font-weight="800">에너지·추진</text><text x="125" y="395" fill="#e9f7ff" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="22">원자로의 열 → 전기와 장기 운항</text></g><g filter="url(#sh)"><rect x="855" y="290" width="650" height="190" rx="28" fill="#0d2942" stroke="#ffbf69" stroke-width="3"/><text x="885" y="348" fill="#ffbf69" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="29" font-weight="800">의료·산업</text><text x="885" y="395" fill="#e9f7ff" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="22">방사선 → 영상·치료·비파괴검사</text></g><g filter="url(#sh)"><rect x="95" y="540" width="650" height="190" rx="28" fill="#0d2942" stroke="#8ae6b5" stroke-width="3"/><text x="125" y="598" fill="#8ae6b5" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="29" font-weight="800">재료·계통</text><text x="125" y="645" fill="#e9f7ff" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="22">열·압력·방사선 → 견고한 구조</text></g><g filter="url(#sh)"><rect x="855" y="540" width="650" height="190" rx="28" fill="#0d2942" stroke="#d8a6ff" stroke-width="3"/><text x="885" y="598" fill="#d8a6ff" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="29" font-weight="800">안전·방호</text><text x="885" y="645" fill="#e9f7ff" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="22">다중장벽·차폐·감시 → 영향 제한</text></g><circle cx="800" cy="510" r="88" fill="#f6b84b" opacity=".95"/><circle cx="770" cy="490" r="21" fill="#fff"/><circle cx="830" cy="530" r="21" fill="#fff"/><text x="800" y="520" text-anchor="middle" fill="#071a2c" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="25" font-weight="900">핵과 방사선</text></svg>
