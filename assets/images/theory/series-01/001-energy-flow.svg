<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#06182b"/><stop offset="1" stop-color="#123b5a"/></linearGradient><filter id="sh"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-opacity=".28"/></filter><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#58d6ff"/></marker></defs>
<rect width="1600" height="900" rx="36" fill="url(#bg)"/><text x="90" y="92" fill="#80defa" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="28" font-weight="700">원자력이론 · 핵심 개념</text><text x="90" y="154" fill="white" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="52" font-weight="800">원자핵에서 전력까지</text><text x="90" y="202" fill="#cceafa" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="25">미시적 핵반응이 거시적 에너지 시스템으로 확대되는 경로</text><g filter="url(#sh)"><rect x="80" y="300" width="250" height="250" rx="28" fill="#0d2942" stroke="#58d6ff" stroke-width="3"/><text x="110" y="358" fill="#58d6ff" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="29" font-weight="800">1  핵분열</text><text x="110" y="405" fill="#e9f7ff" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="22">원자핵의 에너지 방출</text></g><g filter="url(#sh)"><rect x="405" y="300" width="250" height="250" rx="28" fill="#0d2942" stroke="#58d6ff" stroke-width="3"/><text x="435" y="358" fill="#58d6ff" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="29" font-weight="800">2  연료·노심</text><text x="435" y="405" fill="#e9f7ff" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="22">열의 지속적 생성</text></g><g filter="url(#sh)"><rect x="730" y="300" width="250" height="250" rx="28" fill="#0d2942" stroke="#58d6ff" stroke-width="3"/><text x="760" y="358" fill="#58d6ff" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="29" font-weight="800">3  냉각·증기</text><text x="760" y="405" fill="#e9f7ff" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="22">열의 안전한 이동</text></g><g filter="url(#sh)"><rect x="1055" y="300" width="250" height="250" rx="28" fill="#0d2942" stroke="#58d6ff" stroke-width="3"/><text x="1085" y="358" fill="#58d6ff" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="29" font-weight="800">4  터빈</text><text x="1085" y="405" fill="#e9f7ff" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="22">열에너지의 회전 변환</text></g><g filter="url(#sh)"><rect x="1330" y="300" width="190" height="250" rx="28" fill="#0d2942" stroke="#58d6ff" stroke-width="3"/><text x="1360" y="358" fill="#58d6ff" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="29" font-weight="800">5  전력</text><text x="1360" y="405" fill="#e9f7ff" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="22">전력망 공급</text></g><path d="M330 425L405 425" stroke="#58d6ff" stroke-width="8" fill="none" marker-end="url(#arr)"/><path d="M655 425L730 425" stroke="#58d6ff" stroke-width="8" fill="none" marker-end="url(#arr)"/><path d="M980 425L1055 425" stroke="#58d6ff" stroke-width="8" fill="none" marker-end="url(#arr)"/><path d="M1305 425L1330 425" stroke="#58d6ff" stroke-width="8" fill="none" marker-end="url(#arr)"/><text x="800" y="690" text-anchor="middle" fill="#fff" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="31" font-weight="700">각 단계에는 물리·열수력·재료·계측제어·안전이 함께 작동한다</text><rect x="280" y="735" width="1040" height="72" rx="36" fill="#173d57"/><text x="800" y="781" text-anchor="middle" fill="#8ce6ff" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="25">에너지를 이용 가능한 형태로 바꾸면서 위험을 제한하는 통합공학</text></svg>
