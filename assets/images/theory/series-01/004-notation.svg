<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#06182b"/><stop offset="1" stop-color="#123b5a"/></linearGradient><filter id="sh"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-opacity=".28"/></filter><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#58d6ff"/></marker></defs>
<rect width="1600" height="900" rx="36" fill="url(#bg)"/><text x="90" y="92" fill="#80defa" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="28" font-weight="700">원자력이론 · 핵심 개념</text><text x="90" y="154" fill="white" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="52" font-weight="800">핵종 기호를 읽는 세 숫자</text><text x="90" y="202" fill="#cceafa" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="25">Z는 양성자, A는 전체 핵자, N은 계산으로 구한다</text><g transform="translate(190 270)" filter="url(#sh)"><rect x="0" y="0" width="550" height="440" rx="36" fill="#f3f9fc"/><text x="300" y="280" text-anchor="middle" fill="#0a2941" font-family="Georgia,serif" font-size="180" font-weight="700">C</text><text x="95" y="130" fill="#e65353" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="88" font-weight="900">14</text><text x="105" y="355" fill="#238ec0" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="88" font-weight="900">6</text></g><g><g filter="url(#sh)"><rect x="855" y="275" width="610" height="120" rx="28" fill="#0d2942" stroke="#ff756d" stroke-width="3"/><text x="885" y="333" fill="#ff756d" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="29" font-weight="800">A = 14</text><text x="885" y="380" fill="#e9f7ff" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="22">질량수 · 양성자와 중성자의 합</text></g><g filter="url(#sh)"><rect x="855" y="430" width="610" height="120" rx="28" fill="#0d2942" stroke="#63d7ff" stroke-width="3"/><text x="885" y="488" fill="#63d7ff" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="29" font-weight="800">Z = 6</text><text x="885" y="535" fill="#e9f7ff" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="22">원자번호 · 양성자 수</text></g><g filter="url(#sh)"><rect x="855" y="585" width="610" height="120" rx="28" fill="#0d2942" stroke="#9fe0b5" stroke-width="3"/><text x="885" y="643" fill="#9fe0b5" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="29" font-weight="800">N = A − Z = 8</text><text x="885" y="690" fill="#e9f7ff" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="22">중성자 수 · 질량수에서 계산</text></g></g></svg>
