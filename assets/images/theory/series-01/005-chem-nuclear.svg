<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#06182b"/><stop offset="1" stop-color="#123b5a"/></linearGradient><filter id="sh"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-opacity=".28"/></filter><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#58d6ff"/></marker></defs>
<rect width="1600" height="900" rx="36" fill="url(#bg)"/><text x="90" y="92" fill="#80defa" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="28" font-weight="700">원자력이론 · 핵심 개념</text><text x="90" y="154" fill="white" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="52" font-weight="800">화학적으로 닮고 핵적으로 다른 동위원소</text><text x="90" y="202" fill="#cceafa" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="25">전자배치는 비슷하지만 질량·안정성·핵반응 특성은 달라진다</text><g transform="translate(90 285)"><rect width="660" height="430" rx="36" fill="#0d2942" stroke="#65d7ff" stroke-width="4"/><text x="330" y="75" text-anchor="middle" fill="#65d7ff" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="35" font-weight="800">공통된 화학적 정체성</text><text x="330" y="155" text-anchor="middle" fill="#fff" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="28">같은 양성자 수</text><text x="330" y="215" text-anchor="middle" fill="#fff" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="28">비슷한 전자 배열</text><text x="330" y="275" text-anchor="middle" fill="#fff" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="28">비슷한 화학반응</text><circle cx="330" cy="355" r="48" fill="#53c8f4"/><circle cx="330" cy="355" r="15" fill="#fff"/></g><g transform="translate(850 285)"><rect width="660" height="430" rx="36" fill="#0d2942" stroke="#ffbd69" stroke-width="4"/><text x="330" y="75" text-anchor="middle" fill="#ffbd69" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="35" font-weight="800">달라지는 핵공학적 성질</text><text x="330" y="155" text-anchor="middle" fill="#fff" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="28">질량과 안정성</text><text x="330" y="215" text-anchor="middle" fill="#fff" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="28">중성자 반응확률</text><text x="330" y="275" text-anchor="middle" fill="#fff" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="28">방사선 방출 여부</text><path d="M210 360C280 310 380 310 450 360" stroke="#ffbd69" stroke-width="8" fill="none"/><circle cx="210" cy="360" r="23" fill="#ed6962"/><circle cx="330" cy="325" r="23" fill="#aab8c6"/><circle cx="450" cy="360" r="23" fill="#aab8c6"/></g></svg>
