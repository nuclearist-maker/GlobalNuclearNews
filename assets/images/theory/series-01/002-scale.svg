<rect width="1600" height="900" rx="36" fill="url(#bg)"/><text x="90" y="92" fill="#80defa" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="28" font-weight="700">원자력이론 · 핵심 개념</text><text x="90" y="154" fill="white" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="52" font-weight="800">원자와 원자핵의 크기</text><text x="90" y="202" fill="#cceafa" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="25">반지름 기준 약 10만 배, 부피 기준 약 10¹⁵배의 차이</text><g transform="translate(120 280)"><ellipse cx="420" cy="240" rx="420" ry="230" fill="#1c5d82" stroke="#76ddff" stroke-width="5"/><circle cx="420" cy="240" r="10" fill="#ffc55b"/><text x="420" y="545" text-anchor="middle" fill="white" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="29" font-weight="800">원자 · 약 10⁻¹⁰ m</text><text x="420" y="585" text-anchor="middle" fill="#bfeaff" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="22">전자구름이 차지하는 넓은 공간</text></g><path d="M975 520L1115 520" stroke="#58d6ff" stroke-width="8" marker-end="url(#arr)"/><g transform="translate(1170 330)"><circle cx="150" cy="150" r="80" fill="#ffbd59" stroke="#fff" stroke-opacity=".45" stroke-width="3"/><circle cx="115" cy="125" r="42" fill="#e75d5d" stroke="#fff" stroke-opacity=".45" stroke-width="3"/><circle cx="180" cy="175" r="42" fill="#7fc8ff" stroke="#fff" stroke-opacity=".45" stroke-width="3"/><text x="150" y="340" text-anchor="middle" fill="white" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="29" font-weight="800">원자핵 · 약 10⁻¹⁵ m</text><text x="150" y="382" text-anchor="middle" fill="#bfeaff" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="22">질량이 집중된 작은 중심</text></g></svg>
