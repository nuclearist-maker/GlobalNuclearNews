<text x="800" y="785" text-anchor="middle" fill="#fff" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="31" font-weight="800">양성자는 이름, 중성자는 핵종, 전자는 화학반응을 좌우한다</text></svg>
