<g filter="url(#sh)"><rect x="590" y="310" width="420" height="370" rx="28" fill="#0d2942" stroke="#aabed0" stroke-width="3"/><text x="620" y="368" fill="#aabed0" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="29" font-weight="800">중성자 n</text><text x="620" y="425" fill="#e9f7ff" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="22"><tspan x="620">전하 0 · 질량 약 1</tspan><tspan x="620" dy="42">동위원소·핵 안정성</tspan></text><circle cx="800" cy="575" r="72" fill="#aab8c6" stroke="#fff" stroke-opacity=".45" stroke-width="3"/></g>
