<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#06182b"/><stop offset="1" stop-color="#123b5a"/></linearGradient><filter id="sh"><feDropShadow dy="14" stdDeviation="18" flood-opacity=".28"/></filter></defs><rect width="1600" height="900" rx="36" fill="url(#bg)"/><text x="90" y="92" fill="#80defa" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="28" font-weight="700">원자력이론 · 핵심 개념</text><text x="90" y="154" fill="white" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="52" font-weight="800">세 입자의 역할 분담</text><text x="90" y="202" fill="#cceafa" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="25">원소·동위원소·화학적 성질을 결정하는 서로 다른 기능</text>
