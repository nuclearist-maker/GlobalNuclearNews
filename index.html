<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="글로벌 원자력 뉴스와 심층 분석을 제공하는 한국어 게시판">
  <title>GlobalNuclearNews</title>
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <header class="masthead">
    <a class="brand" href="index.html" aria-label="GlobalNuclearNews 홈">
      <span class="brand-mark" aria-hidden="true">GN</span>
      <span><strong>GlobalNuclearNews</strong><small>GLOBAL NUCLEAR INTELLIGENCE</small></span>
    </a>
    <nav aria-label="주요 메뉴">
      <a class="active" href="index.html">게시판</a>
    </nav>
  </header>

  <main>
    <section class="intro" aria-labelledby="page-title">
      <img class="hero-image" src="assets/images/global-nuclear-future-hero.png" alt="원자력발전이 데이터센터와 인공지능, 항공, 우주개발, 친환경 에너지 체계를 연결하는 미래 풍경">
      <div class="hero-title"><h1 id="page-title">글로벌 원자력 소식</h1></div>
    </section>

    <section class="board" aria-labelledby="board-title">
      <div class="board-heading">
        <div><p class="eyebrow">LATEST ANALYSIS</p><h2 id="board-title">최신 게시물</h2></div>
        <label class="search"><span class="sr-only">게시물 검색</span><input id="search" type="search" placeholder="제목과 내용 검색" autocomplete="off"></label>
      </div>
      <div class="filters" role="group" aria-label="분야 필터">
        <button class="selected" type="button" data-filter="전체">전체</button>
        <button type="button" data-filter="대형원전">대형원전</button>
        <button type="button" data-filter="SMR">SMR</button>
        <button type="button" data-filter="연료주기">연료주기</button>
        <button type="button" data-filter="정책·규제">정책·규제</button>
        <button type="button" data-filter="선진원자로">선진원자로</button>
        <button type="button" data-filter="해양원전">해양원전</button>
        <button type="button" data-filter="우주원자로">우주원자로</button>
        <button type="button" data-filter="다목적이용">다목적이용</button>
      </div>
      <div id="post-list" class="post-list" aria-live="polite"></div>
      <p id="empty-state" class="empty" hidden>조건에 맞는 게시물이 없습니다.</p>
    </section>

  </main>

  <footer><span>© 2026 GlobalNuclearNews</span><span>Independent nuclear industry briefing</span></footer>
  <script src="assets/app.js" defer></script>
</body>
</html>
