name: Deploy GlobalNuclearNews to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install theory QA dependencies
        run: python -m pip install --disable-pip-version-check beautifulsoup4 pillow
      - name: Verify news spacing checker and actual published text
        run: |
          python tools/test_news_spacing_gate.py
          python tools/news_spacing_gate.py
      - name: Block deployment when theory content or images fail QA
        run: python tools/qa_theory_posts.py --first 1 --last 50
      - name: Require independent visual approval for unchanged release files
        run: python tools/theory_release_gate.py
      - name: Require approval and evidence for every changed public file
        run: python tools/project_quality_gate.py --site
      - name: Package verified public site files
        run: python tools/build_pages_release.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
